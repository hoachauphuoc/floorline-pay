# Render Blueprint for the public Floorline Pay demo: one Docker web service, the Flask API and the Next.js console in one
# container (see Dockerfile). Secrets are never stored here: every `sync: false` value is typed into the Render dashboard.
# Hybrid: Render runs the app; a Google Cloud project of its own holds Firestore (the store) and Pub/Sub (a release reaches the
# settler through a push to /api/v1/receiver/decision). VF_SEED_PAYMENT_DEMO puts the demo's starting state back when the store is
# empty (src/vf_logistics/demo_seed.py). The Google side is docs/GCP_FOR_RENDER.md; the Render side is docs/RENDER_DEPLOY.md.
services:
  - type: web
    name: floorline-pay
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: STORE_BACKEND
        value: firestore
      # The key file of the Google service account, added in the dashboard as a secret file named gcp-key.json.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcp-key.json
      - key: VF_SEED_PAYMENT_DEMO
        value: "true"
      - key: VF_ONE_CLICK_JUDGE
        value: "true"
      - key: VF_ONE_CLICK_EMAIL
        value: guest-judge@floorline.example
      # The demo must stay open until judging ends on 15 Dec 2026.
      - key: VF_ONE_CLICK_UNTIL
        value: "2026-12-16T00:00:00Z"
      # Nobody reads the API or the console without signing in. The one-click guest session stays; it can neither release nor approve.
      - key: ANONYMOUS_ROLE
        value: none
      - key: VF_PUBLIC_READS
        value: "false"
      # The model spend a judge's visit can cause is capped; set the number you are willing to pay for.
      - key: VF_TENANT_SPEND_CEILING_USD
        value: "20"
      - key: VF_API_KEY
        generateValue: true
      - key: VF_SESSION_SECRET
        generateValue: true
      - key: VF_MANDATE_SECRET
        generateValue: true
      # The sandbox carrier account that demo payouts go to.
      - key: VF_DEMO_PAYEE_EMAIL
        sync: false
      # The address Render gives the service, e.g. https://floorline-pay.onrender.com (known after the first deploy).
      - key: PAYMENT_RETURN_ORIGINS
        sync: false
      # The id of the Google Cloud project that holds Firestore and Pub/Sub.
      - key: PROJECT_ID
        sync: false
      # The service account the Pub/Sub push presents, and the audience it signs for (the push endpoint itself).
      - key: RECEIVER_PUSH_SA
        sync: false
      - key: RECEIVER_PUSH_AUDIENCE
        sync: false
      # Two or more people with passwords (reviewer A and B, so a release above 2500 USD can be seen needing a second person).
      - key: VF_OPERATORS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OPERATOR_EMAILS
        sync: false
      - key: REVIEWER_EMAILS
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
